<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/pages/aluno/home.css" />

    <title>Gestão de Estágios</title>
  </head>
  <body>
    <header>
      <span class="info-SITE"
        >SITE - Sistema Integrado de Trabalho e Estágio</span
      >
      <div class="header-info">
        <div class="header-info-text">
          <h2>Olá, aluno!</h2>
          <p>Acompanhe suas horas e pendências</p>
        </div>
        <div class="header-info-icon">
          <img
            src="../../assets/icons/icon-notificacao-on.svg"
            alt="Notificações existentes"
          />
        </div>
      </div>
    </header>

    <main>
      <section
        class="progress-card"
        aria-labelledby="progress-title"
        data-total="240"
        data-done="120"
      >
        <h2 id="progress-title" class="progress-card__title">Seu progresso</h2>
        <p class="progress-card__subtitle">
          Um passo mais perto da sua formação.
        </p>

        <p class="progress-card__hours">
          <span data-done-text>120</span> /
          <span data-total-text>240</span> horas
        </p>

        <div
          class="progress-card__bar"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="50"
          aria-label="Progresso da formação"
        >
          <div class="progress-card__fill"></div>
        </div>

        <div class="progress-card__stats">
          <div>
            <strong><span data-percent>50</span>% concluído</strong>
            <small><span data-done-text>120</span> horas validadas</small>
          </div>
          <div>
            <strong><span data-remaining>120</span>h restantes</strong>
            <small>Até a conclusão</small>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="#inicio" class="bottom-nav__item is-active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"
          />
        </svg>
        <span>Início</span>
      </a>

      <a href="#atividades" class="bottom-nav__item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="7" width="18" height="13" rx="2" />
          <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18" />
        </svg>
        <span>Atividades</span>
      </a>

      <a href="#documentos" class="bottom-nav__item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"
          />
          <path d="M14 3v5h5M9 13h6M9 17h6" />
        </svg>
        <span>Documentos</span>
      </a>

      <a href="#perfil" class="bottom-nav__item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
        <span>Perfil</span>
      </a>
    </nav>

    <script src="../../js/pages/aluno/home.js"></script>
  </body>
</html>
