<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Estágio/title>
      
    <link rel="stylesheet" href="../../styles/pages/aluno/cadastro-de-estagio.css">
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/components/menu-navbar.css" />
    <link rel="stylesheet" href="../../styles/components/card-estagio.css" />
    <link rel="stylesheet" href="../../styles/components/header.css" />
    <link rel="stylesheet" href="../../styles/components/busca.css" />
</head>
<body>
    <main>
    <label class="campo">
      <span>Razão social</span>
      <input type="text" name="razaoSocial" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>CNPJ</span>
      <input type="text" name="cnpj" id="cnpj" inputmode="numeric" maxlength="18" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Setor / departamento</span>
      <input type="text" name="setor" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Endereço completo</span>
      <input type="text" name="endereco" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Bairro</span>
      <input type="text" name="bairro" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>CEP</span>
      <input type="text" name="cep" id="cep" inputmode="numeric" maxlength="9" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Cidade</span>
      <input type="text" name="cidade" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Estado</span>
      <input type="text" name="estado" maxlength="2" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Telefone / ramal</span>
      <input type="tel" name="telefoneEmpresa" id="telefoneEmpresa" maxlength="15" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>E-mail da empresa</span>
      <input type="email" name="emailEmpresa" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Site</span>
      <input type="url" name="site" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Representante legal</span>
      <input type="text" name="representante" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>CPF do representante</span>
      <input type="text" name="cpfRepresentante" id="cpf" inputmode="numeric" maxlength="14" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Cargo do representante</span>
      <input type="text" name="cargoRepresentante" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Nome do supervisor</span>
      <input type="text" name="supervisor" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Cargo do supervisor</span>
      <input type="text" name="cargoSupervisor" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Telefone do supervisor</span>
      <input type="tel" name="telefoneSupervisor" id="telefoneSupervisor" maxlength="15" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>E-mail do supervisor</span>
      <input type="email" name="emailSupervisor" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Nº da apólice do seguro</span>
      <input type="text" name="apolice" placeholder="Digite aqui...">
    </label>

    <label class="campo">
      <span>Seguradora</span>
      <input type="text" name="seguradora" placeholder="Digite aqui...">
    </label>

    <button class="botao" type="button">Continuar</button>
  </main>

</body>
</html>
