<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/components/menu-navbar.css" />
    <link rel="stylesheet" href="../../styles/components/header.css" />
    <link rel="stylesheet" href="../../styles/components/btn-voltar.css" />
    <link
      rel="stylesheet"
      href="../../styles/pages/aluno/cadastro-estagio.css"
    />

    <title>Cadastro de Estágio</title>
  </head>
  <body>
    <header>
      <span class="info-SITE">
        <button
          type="button"
          class="btn-voltar"
          aria-label="Voltar"
          data-voltar="novo-estagio.html"
        ></button>
        SITE - Sistema Integrado de Trabalho e Estágio
      </span>
      <div class="header-info">
        <div class="header-info-text">
          <h2>Nova atividade</h2>
          <p>Selecione o que deseja cadastrar</p>
        </div>
        <div class="header-info-icon">
          <img
            src="../../assets/icons/icon-notificacao-on.svg"
            alt="Notificações existentes"
          />
        </div>
      </div>
    </header>

    <main>
      <section class="grupo">
        <div class="grupo-titulo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="7" width="18" height="13" rx="2" />
            <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" /></svg
          ><span>Empresa</span>
        </div>
        <label class="campo">
          <span>Razão social</span>
          <input type="text" name="razaoSocial" placeholder="Digite aqui..." />
        </label>
        <label class="campo">
          <span>CNPJ</span>
          <input
            type="text"
            name="cnpj"
            id="cnpj"
            inputmode="numeric"
            maxlength="18"
            placeholder="Digite aqui..."
          />
        </label>
        <label class="campo">
          <span>Setor / departamento</span>
          <input type="text" name="setor" placeholder="Digite aqui..." />
        </label>
        <label class="campo">
          <span>Telefone / ramal</span>
          <input
            type="text"
            name="telefoneEmpresa"
            id="telefoneEmpresa"
            maxlength="15"
            placeholder="Digite aqui..."
          />
        </label>
        <label class="campo">
          <span>E-mail da empresa</span>
          <input type="text" name="emailEmpresa" placeholder="Digite aqui..." />
        </label>
        <label class="campo">
          <span>Site</span>
          <input type="text" name="site" placeholder="Digite aqui..." />
        </label>
      </section>

      <section class="grupo">
        <div class="grupo-titulo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z" />
            <circle cx="12" cy="10" r="2.5" /></svg
          ><span>Endereço</span>
        </div>
        <label class="campo">
          <span>Endereço completo</span>
          <input type="text" name="endereco" placeholder="Digite aqui..." />
        </label>
        <div class="linha">
          <label class="campo">
            <span>Bairro</span>
            <input type="text" name="bairro" placeholder="Digite aqui..." />
          </label>
          <label class="campo">
            <span>CEP</span>
            <input
              type="text"
              name="cep"
              id="cep"
              inputmode="numeric"
              maxlength="9"
              placeholder="Digite aqui..."
            />
          </label>
        </div>
        <div class="linha estado">
          <label class="campo">
            <span>Cidade</span>
            <input type="text" name="cidade" placeholder="Digite aqui..." />
          </label>
          <label class="campo">
            <span>Estado</span>
            <input
              type="text"
              name="estado"
              maxlength="2"
              placeholder="Digite aqui..."
            />
          </label>
        </div>
      </section>

      <section class="grupo">
        <div class="grupo-titulo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" /></svg
          ><span>Representante legal</span>
        </div>
        <label class="campo">
          <span>Representante legal</span>
          <input
            type="text"
            name="representante"
            placeholder="Digite aqui..."
          />
        </label>
        <label class="campo">
          <span>CPF do representante</span>
          <input
            type="text"
            name="cpfRepresentante"
            id="cpf"
            inputmode="numeric"
            maxlength="14"
            placeholder="Digite aqui..."
          />
        </label>
        <label class="campo">
          <span>Cargo do representante</span>
          <input
            type="text"
            name="cargoRepresentante"
            placeholder="Digite aqui..."
          />
        </label>
      </section>

      <section class="grupo">
        <div class="grupo-titulo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" /></svg
          ><span>Supervisor do estágio</span>
        </div>
        <label class="campo">
          <span>Nome do supervisor</span>
          <input type="text" name="supervisor" placeholder="Digite aqui..." />
        </label>
        <label class="campo">
          <span>Cargo do supervisor</span>
          <input
            type="text"
            name="cargoSupervisor"
            placeholder="Digite aqui..."
          />
        </label>
        <label class="campo">
          <span>Telefone do supervisor</span>
          <input
            type="text"
            name="telefoneSupervisor"
            id="telefoneSupervisor"
            maxlength="15"
            placeholder="Digite aqui..."
          />
        </label>
        <label class="campo">
          <span>E-mail do supervisor</span>
          <input
            type="text"
            name="emailSupervisor"
            placeholder="Digite aqui..."
          />
        </label>
      </section>

      <section class="grupo">
        <div class="grupo-titulo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6l8-3z" /></svg
          ><span>Seguro</span>
        </div>
        <label class="campo">
          <span>Nº da apólice do seguro</span>
          <input type="text" name="apolice" placeholder="Digite aqui..." />
        </label>
        <label class="campo">
          <span>Seguradora</span>
          <input type="text" name="seguradora" placeholder="Digite aqui..." />
        </label>
      </section>

      <button class="botao" type="button">Continuar</button>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="home.html" class="bottom-nav__item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"
          />
        </svg>
        <span>Início</span>
      </a>

      <a href="estagios.html" class="bottom-nav__item is-active" aria-current="location">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="7" width="18" height="13" rx="2" />
          <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18" />
        </svg>
        <span>Estágios</span>
      </a>

      <a href="perfil.html" class="bottom-nav__item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
        <span>Perfil</span>
      </a>
    </nav>

    <script src="../../js/components/menu-navbar.js"></script>
    <script src="../../js/components/btn-voltar.js"></script>
    <script src="../../js/pages/aluno/cadastro-estagio.js"></script>
  </body>
</html>
