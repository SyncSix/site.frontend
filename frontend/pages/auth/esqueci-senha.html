<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/pages/auth/esqueci-senha.css" />
    <link rel="stylesheet" href="../../styles/components/btn-voltar.css" />

    <title>Gestão de Estágio</title>
  </head>
  <body>
    <main>
      <button type="button" class="btn-voltar" aria-label="Voltar" data-voltar="login.html"></button>
      <img
        src="../../assets/images/icon-logoSITE.svg"
        alt="Logo FATEC Votorantim"
      />
      <h1>Recuperação de Senha</h1>
      <div class="subtitulo">
        <p class="text-subtitulo">Para recuperar a sua senha, informe a baixo o seu endereço de email cadastrado.</p>
        <p class="text-subtitulo">Enviaremos um link para alteração</p>
      </div>
      <form>
        <div class="form-email">
          <input type="email" class="input-email" id="email" 
          autocomplete="off" placeholder="Digite seu email..."/>
        </div>
        <button type="submit" class="btn-form-recuperacao">Entrar</button>
      </form>
    </main>
    <script src="../../js/pages/auth/esqueci-senha.js"></script>
    <script src="../../js/components/btn-voltar.js"></script>
  </body>
</html>
