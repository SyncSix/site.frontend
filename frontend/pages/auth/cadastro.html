<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/components/form.css" />
    <link rel="stylesheet" href="../../styles/pages/cadastro.css" />

    <title>Gestão de Estágio</title>
  </head>
  <body>
    <main>
      <img
        src="../../assets/images/LogoFatecVoto.svg"
        alt="Logo FATEC Votorantim"
        id="logo-fatec"
      />
      <h1>Cadastro</h1>
      <p class="subtitulo">Cadastre-se com seus dados acadêmicos</p>
      <form action="">
        <div class="form-group">
          <label for="nome" class="form-label form-group--full">
            Nome Completo
          </label>
          <input
            type="text"
            class="form-input"
            id="nome"
            name="nome"
            required
          />
        </div>
        <div class="form-group">
          <label for="RA" class="form-label">RA</label>
          <input type="text" class="form-input" id="RA" name="RA" required />
        </div>
        <div class="form-group">
          <label for="curso" class="form-label">Curso</label>
          <select name="curso" id="curso" class="form-input" required>
            <option value="" disabled selected>Escolha uma opção...</option>
            <option value="DSM">
              Desenvolvimento de Software Multiplataforma
            </option>
            <option value="CDN">Ciência de Dados para Negócios</option>
            <option value="CO">Controle de Obras</option>
          </select>
        </div>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-input"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="seu.nome@aluno.cps.sp.gov.br"
            required
            aria-describedby="email-error"
          />
          <span class="form-error" id="email-error" aria-live="polite"></span>
        </div>
        <div class="form-group">
          <label for="confirm-email" class="form-label"
            >Confirme seu Email</label
          >
          <input
            type="email"
            class="form-input"
            id="confirm-email"
            name="confirm-email"
            autocomplete="off"
            required
            aria-describedby="confirm-email-error"
          />
          <span
            class="form-error"
            id="confirm-email-error"
            aria-live="polite"
          ></span>
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Senha</label>
          <input
            type="password"
            class="form-input"
            id="password"
            name="password"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>
        <div class="form-group">
          <label for="confirm-password" class="form-label"
            >Confirme sua Senha</label
          >
          <input
            type="password"
            class="form-input"
            id="confirm-password"
            name="confirm-password"
            autocomplete="new-password"
            required
            aria-describedby="confirm-password-error"
          />
          <span
            class="form-error"
            id="confirm-password-error"
            aria-live="polite"
          ></span>
        </div>
        <button type="submit" class="btn-form-cadastrar">Cadastrar</button>
      </form>
      <div class="separador">
        <span class="linha"></span>
        <span>ou</span>
        <span class="linha"></span>
      </div>
      <a href="./login.html" class="btn-login">Fazer Login</a>
    </main>
    <script src="../../js/pages/cadastro.js"></script>
  </body>
</html>
