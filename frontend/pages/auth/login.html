<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/pages/login.css" />
    <title>Gestão de Estágio</title>
  </head>
  <body>
    <main>
      <img
        src="../../assets/images/LogoFatecVoto.svg"
        alt="Logo FATEC Votorantim"
      />
      <h1>Gestão de Estágios</h1>
      <p class="subtitulo">Acesse com seus dados acadêmicos</p>
      <form action="">
        <div class="form-login">
          <label for="login" class="label-login">Email ou RA</label>
          <input type="email" class="input-login" id="login" />
        </div>
        <div class="form-password">
          <label for="password" class="label-password">Senha</label>
          <input type="password" class="input-password" id="password" />
        </div>
        <button type="submit" class="btn-form-login">Login</button>
      </form>
      <a href="" class="btn-esqueci-senha">Esqueci minha senha</a>
      <div class="separador">
        <span class="linha"></span>
        <span>ou</span>
        <span class="linha"></span>
      </div>
      <a href="./cadastro.html" class="btn-primeiro-acesso">Primeiro Acesso</a>
    </main>
  </body>
</html>
