<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../styles/pages/auth/login.css" />
    <link rel="stylesheet" href="../../styles/responsividade.css" />
    <title>Gestão de Estágio</title>
  </head>
  <body>
    <main>
      <img
        src="../../assets/images/icon-logoSITE.svg"
        alt="Logo FATEC Votorantim"
      />
      <p class="subtitulo">Acesse com seus dados acadêmicos</p>
      <form action="">
        <div class="form-email">
          <label for="email" class="label-email">Email ou RA</label>
          <input type="email" class="input-email" id="email" 
          autocomplete="off"/>
        </div>
        <div class="form-password">
          <label for="password" class="label-password">Senha</label>
          <input type="password" class="input-password" id="password" 
          autocomplete="new-password"/>
          <button
            type="button"
            class="toggle-password"
            aria-label="Mostrar senha"
            aria-pressed="false"
          ></button>
        </div>
        <button type="submit" class="btn-form-login">Entrar</button>
      </form>
      <a href="./esqueci-senha.html" class="btn-esqueci-senha">Esqueci minha senha</a>
      <div class="separador">
        <span class="linha"></span>
        <span>ou</span>
        <span class="linha"></span>
      </div>
      <a href="./cadastro.html" class="btn-primeiro-acesso">Primeiro Acesso</a>
    </main>
    <script src="../../js/pages/login.js"></script>
  </body>
</html>
